name: Portable Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install UI build tools and verify bundled CSS
        run: |
          npm ci
          npm run check:css
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Check JavaScript
        run: |
          node --check ui/app.js
          node --check ui/i18n.js
      - name: Browser tests without desktop capture
        shell: pwsh
        run: |
          npx playwright install chromium
          cargo build --locked --example ui-test-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:browser
      - name: Upload browser verification images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: artifacts/browser-ci/*.png

  docker-release:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        id: buildx
      # type=gha preserves Docker layers, but not mutable Cargo cache mounts.
      - name: Restore Cargo caches
        uses: actions/cache@v4
        id: cargo-cache
        with:
          path: artifacts/docker-cargo-cache
          key: docker-cargo-${{ runner.os }}-amd64-${{ hashFiles('Dockerfile', '.cargo/config.toml', 'Cargo.toml', 'Cargo.lock') }}
      - name: Inject and save Cargo cache mounts
        uses: reproducible-containers/buildkit-cache-dance@ca04d1a0e0018e28a060ec9f87518ddc453b4460 # v3.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "artifacts/docker-cargo-cache/registry": {"target": "/usr/local/cargo/registry", "sharing": "locked"},
              "artifacts/docker-cargo-cache/target": {"target": "/workspace/target", "sharing": "locked"}
            }
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}
      - name: Build and package Windows executable in Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: release
          outputs: type=local,dest=artifacts/release
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify package checksums
        working-directory: artifacts/release
        run: sha256sum --check SHA256SUMS.txt
      - name: Upload executable, ZIP and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: ScheduledScreenshot-win-x64
          path: artifacts/release/*
          if-no-files-found: error
