name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ScreenCapture.sln

      - name: Check offline editor
        run: node scripts/check-editor.js

      - name: Build
        run: dotnet build ScreenCapture.sln --configuration Release --no-restore --property:Platform=x64

      - name: Test
        run: dotnet test tests/ScheduledScreenshot.Tests/ScheduledScreenshot.Tests.csproj --configuration Release --no-build --property:Platform=x64

      - name: Package portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path src/ScheduledScreenshot/bin/x64/Release/net48/* -DestinationPath artifacts/ScheduledScreenshot-win-x64.zip
          (Get-FileHash artifacts/ScheduledScreenshot-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  ScheduledScreenshot-win-x64.zip' | Set-Content artifacts/ScheduledScreenshot-win-x64.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScheduledScreenshot-win-x64
          path: artifacts/*
